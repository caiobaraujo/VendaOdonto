<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel de Prospecção - SulAmérica Odonto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "system-ui", "sans-serif"],
            },
            colors: {
              primary: "#082f49",
              accent: "#ea580c",
              gold: "#b45309",
              soft: "#f8fafc",
            },
          },
        },
      };
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      * {
        font-family: "Inter", sans-serif;
      }
      .gradient-bg {
        background: linear-gradient(135deg, #082f49 0%, #0f172a 100%);
      }
      .card-hover:hover {
        transform: translateY(-2px);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      }
      .pulse-dot {
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
        100% {
          opacity: 1;
        }
      }
      .skeleton {
        background: linear-gradient(
          90deg,
          #e2e8f0 25%,
          #f1f5f9 50%,
          #e2e8f0 75%
        );
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
      }
      @keyframes shimmer {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }
      .toast {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 9999;
        animation: slideIn 0.3s ease-out;
      }
      @keyframes slideIn {
        from {
          transform: translateX(100%);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body class="bg-slate-50 min-h-screen">
    <!-- Navbar -->
    <nav class="gradient-bg text-white shadow-xl sticky top-0 z-50">
      <div
        class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between"
      >
        <div class="flex items-center gap-3">
          <div
            class="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center"
          >
            <i class="fas fa-tooth text-white"></i>
          </div>
          <div>
            <div class="font-bold text-lg leading-tight">SulAmérica Odonto</div>
            <div class="text-[10px] uppercase tracking-wider text-white/60">
              Painel de Prospecção
            </div>
          </div>
        </div>
        <div class="flex items-center gap-4">
          <span id="status-indicator" class="flex items-center gap-2 text-sm">
            <span class="w-2 h-2 bg-green-400 rounded-full pulse-dot"></span>
            <span class="text-white/80">Sistema Online</span>
          </span>
        </div>
      </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-8">
      <!-- Stats Cards -->
      <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8" id="stats-cards">
        <!-- Preenchido via JavaScript -->
      </div>

      <!-- Painel de Controle -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
        <!-- Card: Novo Scraping -->
        <div
          class="bg-white rounded-2xl shadow-lg p-6 card-hover transition-all duration-300"
        >
          <h2
            class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2"
          >
            <i class="fas fa-magnifying-glass text-accent"></i>
            Nova Prospecção
          </h2>

          <div class="space-y-4">
            <div>
              <label class="block text-sm font-semibold text-gray-600 mb-2"
                >Bairro/Cidade</label
              >
              <input
                type="text"
                id="input-bairro"
                value="Santo Agostinho Belo Horizonte"
                class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-accent/20 focus:border-accent outline-none transition-all"
                placeholder="Ex: Savassi Belo Horizonte"
              />
            </div>

            <div>
              <label class="block text-sm font-semibold text-gray-600 mb-2"
                >Nicho</label
              >
              <input
                type="text"
                id="input-nicho"
                value="Clínica de Estética"
                class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-accent/20 focus:border-accent outline-none transition-all"
                placeholder="Ex: Clínica de Estética"
              />
            </div>

            <button
              id="btn-scraping"
              onclick="iniciarScraping()"
              class="w-full bg-primary text-white py-3 px-6 rounded-xl font-bold hover:bg-sky-900 transition-all flex items-center justify-center gap-2"
            >
              <i class="fas fa-play"></i>
              <span>Iniciar Prospecção</span>
            </button>

            <!-- Status do scraping -->
            <div id="scraping-status" class="hidden">
              <div class="bg-soft rounded-xl p-4">
                <div class="flex items-center gap-3">
                  <div
                    class="animate-spin rounded-full h-5 w-5 border-2 border-primary border-t-transparent"
                  ></div>
                  <span class="text-sm font-medium text-gray-700"
                    >Prospectando...</span
                  >
                </div>
                <div
                  id="scraping-log"
                  class="mt-3 text-xs text-gray-500 space-y-1 max-h-32 overflow-y-auto"
                ></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Card: Filtros Rápidos -->
        <div
          class="bg-white rounded-2xl shadow-lg p-6 card-hover transition-all duration-300"
        >
          <h2
            class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2"
          >
            <i class="fas fa-filter text-accent"></i>
            Filtros Rápidos
          </h2>

          <div class="space-y-3">
            <button
              onclick="filtrarLeads('pronto_para_enviar', 'SIM')"
              class="w-full bg-green-50 text-green-700 py-3 px-4 rounded-xl font-semibold hover:bg-green-100 transition-all text-left flex items-center gap-2"
            >
              <i class="fas fa-check-circle"></i>
              Prontos para Envio
            </button>

            <button
              onclick="filtrarLeads('status', 'Novo')"
              class="w-full bg-blue-50 text-blue-700 py-3 px-4 rounded-xl font-semibold hover:bg-blue-100 transition-all text-left flex items-center gap-2"
            >
              <i class="fas fa-star"></i>
              Leads Novos
            </button>

            <button
              onclick="filtrarLeads('status', 'Interessado')"
              class="w-full bg-yellow-50 text-yellow-700 py-3 px-4 rounded-xl font-semibold hover:bg-yellow-100 transition-all text-left flex items-center gap-2"
            >
              <i class="fas fa-hand-sparkles"></i>
              Interessados
            </button>

            <button
              onclick="carregarLeads()"
              class="w-full bg-gray-50 text-gray-700 py-3 px-4 rounded-xl font-semibold hover:bg-gray-100 transition-all text-left flex items-center gap-2"
            >
              <i class="fas fa-list"></i>
              Todos os Leads
            </button>
          </div>
        </div>

        <!-- Card: Ações em Lote -->
        <div
          class="bg-white rounded-2xl shadow-lg p-6 card-hover transition-all duration-300"
        >
          <h2
            class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2"
          >
            <i class="fas fa-layer-group text-accent"></i>
            Ações em Lote
          </h2>

          <div class="space-y-3">
            <button
              onclick="gerarPrintsLote()"
              class="w-full bg-purple-50 text-purple-700 py-3 px-4 rounded-xl font-semibold hover:bg-purple-100 transition-all text-left flex items-center gap-2"
            >
              <i class="fas fa-camera"></i>
              Gerar Prints (Selecionados)
            </button>

            <button
              onclick="exportarCSV()"
              class="w-full bg-orange-50 text-orange-700 py-3 px-4 rounded-xl font-semibold hover:bg-orange-100 transition-all text-left flex items-center gap-2"
            >
              <i class="fas fa-file-csv"></i>
              Exportar CSV
            </button>

            <div class="bg-soft rounded-xl p-4 mt-4">
              <div class="text-xs text-gray-500 uppercase font-bold mb-2">
                Selecionados
              </div>
              <div
                class="text-2xl font-black text-primary"
                id="contador-selecionados"
              >
                0
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Tabela de Leads -->
      <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
        <div
          class="p-6 border-b border-gray-100 flex items-center justify-between"
        >
          <div>
            <h2 class="text-xl font-bold text-gray-800">Leads Capturados</h2>
            <p class="text-sm text-gray-500 mt-1" id="total-leads-text">
              Carregando...
            </p>
          </div>
          <div class="flex items-center gap-4">
            <input
              type="text"
              id="input-search"
              placeholder="Buscar empresa..."
              class="px-4 py-2 border border-gray-200 rounded-xl focus:ring-2 focus:ring-accent/20 focus:border-accent outline-none text-sm"
              onkeyup="buscarLeads()"
            />
            <button
              onclick="recarregarTabela()"
              class="text-gray-400 hover:text-gray-600 transition-colors"
            >
              <i class="fas fa-rotate"></i>
            </button>
          </div>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full" id="tabela-leads">
            <thead>
              <tr class="bg-slate-50 text-left">
                <th
                  class="px-6 py-4 text-xs font-bold text-gray-500 uppercase tracking-wider"
                >
                  <input
                    type="checkbox"
                    id="select-all"
                    onchange="toggleSelectAll()"
                    class="rounded"
                  />
                </th>
                <th
                  class="px-6 py-4 text-xs font-bold text-gray-500 uppercase tracking-wider"
                >
                  Empresa
                </th>
                <th
                  class="px-6 py-4 text-xs font-bold text-gray-500 uppercase tracking-wider"
                >
                  WhatsApp
                </th>
                <th
                  class="px-6 py-4 text-xs font-bold text-gray-500 uppercase tracking-wider"
                >
                  Bairro
                </th>
                <th
                  class="px-6 py-4 text-xs font-bold text-gray-500 uppercase tracking-wider"
                >
                  Prioridade
                </th>
                <th
                  class="px-6 py-4 text-xs font-bold text-gray-500 uppercase tracking-wider"
                >
                  Status
                </th>
                <th
                  class="px-6 py-4 text-xs font-bold text-gray-500 uppercase tracking-wider"
                >
                  Ações
                </th>
              </tr>
            </thead>
            <tbody id="tbody-leads" class="divide-y divide-gray-100">
              <!-- Preenchido via JavaScript -->
            </tbody>
          </table>
        </div>

        <!-- Paginação -->
        <div
          class="p-6 border-t border-gray-100 flex items-center justify-between"
          id="paginacao"
        >
          <!-- Preenchido via JavaScript -->
        </div>
      </div>
    </main>

    <!-- Toast de Notificação -->
    <div id="toast" class="toast hidden"></div>

    <script>
      // Estado global
      let currentPage = 1;
      let currentFilter = {};
      let leadsSelecionados = new Set();
      let totalLeads = 0;

      // Inicialização
      document.addEventListener("DOMContentLoaded", () => {
        carregarEstatisticas();
        carregarLeads();
      });

      // ==================== ESTATÍSTICAS ====================

      async function carregarEstatisticas() {
        try {
          const response = await fetch("/api/estatisticas");
          const stats = await response.json();

          const cardsHTML = [
            {
              title: "Total de Leads",
              value: stats.total_leads || 0,
              icon: "fa-users",
              color: "bg-blue-500",
            },
            {
              title: "Prontos para Envio",
              value: stats.prontos_para_envio || 0,
              icon: "fa-paper-plane",
              color: "bg-green-500",
            },
            {
              title: "Interessados",
              value: stats.leads_por_status?.Interessado || 0,
              icon: "fa-hand-sparkles",
              color: "bg-yellow-500",
            },
            {
              title: "Bairros",
              value: stats.leads_por_bairro
                ? Object.keys(stats.leads_por_bairro).length
                : 0,
              icon: "fa-map-marker-alt",
              color: "bg-purple-500",
            },
          ];

          document.getElementById("stats-cards").innerHTML = cardsHTML
            .map(
              (card) => `
                    <div class="bg-white rounded-2xl shadow-lg p-6 card-hover transition-all duration-300">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 ${card.color} rounded-xl flex items-center justify-center">
                                <i class="fas ${card.icon} text-white"></i>
                            </div>
                            <div>
                                <div class="text-sm text-gray-500 font-medium">${card.title}</div>
                                <div class="text-2xl font-black text-gray-800">${card.value}</div>
                            </div>
                        </div>
                    </div>
                `,
            )
            .join("");
        } catch (error) {
          console.error("Erro ao carregar estatísticas:", error);
        }
      }

      // ==================== CARREGAR LEADS ====================

      async function carregarLeads(page = 1, filtros = {}) {
        currentPage = page;
        currentFilter = filtros;

        const tbody = document.getElementById("tbody-leads");
        tbody.innerHTML = `
                <tr>
                    <td colspan="7" class="px-6 py-12 text-center">
                        <div class="animate-spin inline-block w-8 h-8 border-4 border-primary border-t-transparent rounded-full"></div>
                        <p class="mt-4 text-gray-500">Carregando leads...</p>
                    </td>
                </tr>
            `;

        try {
          const params = new URLSearchParams({
            page,
            per_page: 50,
            ...filtros,
          });
          const response = await fetch(`/api/leads?${params}`);
          const data = await response.json();

          totalLeads = data.total;
          document.getElementById("total-leads-text").textContent =
            `${data.total} leads encontrados`;

          if (data.leads.length === 0) {
            tbody.innerHTML = `
                        <tr>
                            <td colspan="7" class="px-6 py-12 text-center text-gray-400">
                                <i class="fas fa-inbox text-4xl mb-4 block"></i>
                                <p>Nenhum lead encontrado</p>
                                <p class="text-sm mt-2">Inicie uma nova prospecção ou ajuste os filtros</p>
                            </td>
                        </tr>
                    `;
          } else {
            tbody.innerHTML = data.leads
              .map(
                (lead) => `
                        <tr class="hover:bg-slate-50 transition-colors ${leadsSelecionados.has(lead.id) ? "bg-blue-50" : ""}">
                            <td class="px-6 py-4">
                                <input 
                                    type="checkbox" 
                                    ${leadsSelecionados.has(lead.id) ? "checked" : ""}
                                    onchange="toggleLead(${lead.id})" 
                                    class="rounded checkbox-lead"
                                >
                            </td>
                            <td class="px-6 py-4">
                                <div class="font-semibold text-gray-800">${escapeHtml(lead.empresa_contato)}</div>
                                <div class="text-xs text-gray-400 mt-1">${escapeHtml(lead.empresa_original || "")}</div>
                            </td>
                            <td class="px-6 py-4">
                                <a href="https://wa.me/55${lead.telefone}" target="_blank" 
                                   class="text-green-600 hover:text-green-800 font-medium flex items-center gap-2">
                                    <i class="fab fa-whatsapp"></i>
                                    ${formatarTelefone(lead.telefone)}
                                </a>
                            </td>
                            <td class="px-6 py-4">
                                <span class="px-3 py-1 bg-slate-100 rounded-full text-sm font-medium text-gray-700">
                                    ${escapeHtml(lead.bairro || "N/A")}
                                </span>
                            </td>
                            <td class="px-6 py-4">
                                <span class="font-bold ${lead.prioridade >= 7 ? "text-green-600" : lead.prioridade >= 5 ? "text-yellow-600" : "text-gray-400"}">
                                    ${lead.prioridade}/10
                                </span>
                            </td>
                            <td class="px-6 py-4">
                                <span class="px-3 py-1 rounded-full text-sm font-medium ${getStatusClass(lead.status)}">
                                    ${lead.status || "Novo"}
                                </span>
                            </td>
                            <td class="px-6 py-4">
                                <div class="flex items-center gap-2">
                                    ${
                                      lead.caminho_print
                                        ? `
    <a href="/static/prints/${lead.caminho_print.split("/").pop()}" target="_blank" 
       class="text-blue-600 hover:text-blue-800" title="Ver print">
        <i class="fas fa-image"></i>
    </a>
`
                                        : `
                                        <button onclick="gerarPrintLead(${lead.id})" 
                                                class="text-purple-600 hover:text-purple-800" title="Gerar print">
                                            <i class="fas fa-camera"></i>
                                        </button>
                                    `
                                    }
                                    
                                    <button onclick="copiarLink('${lead.link_landing}')" 
                                            class="text-gray-400 hover:text-gray-600" title="Copiar link">
                                        <i class="fas fa-link"></i>
                                    </button>
                                    
                                    <button onclick="mudarStatus(${lead.id}, 'Contatado')" 
                                            class="text-green-600 hover:text-green-800" title="Marcar como contatado">
                                        <i class="fas fa-check"></i>
                                    </button>
                                    
                                    <a href="https://wa.me/55${lead.telefone}?text=${encodeURIComponent(lead.mensagem_whatsapp || "")}" 
                                       target="_blank"
                                       class="text-green-500 hover:text-green-700" title="Abrir WhatsApp">
                                        <i class="fab fa-whatsapp"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                    `,
              )
              .join("");
          }

          // Atualiza paginação
          atualizarPaginacao(data);

          // Atualiza contador de selecionados
          atualizarContadorSelecionados();
        } catch (error) {
          console.error("Erro ao carregar leads:", error);
          tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="px-6 py-12 text-center text-red-500">
                            <i class="fas fa-exclamation-triangle text-4xl mb-4 block"></i>
                            <p>Erro ao carregar leads</p>
                            <button onclick="carregarLeads()" class="mt-4 text-primary hover:underline">Tentar novamente</button>
                        </td>
                    </tr>
                `;
        }
      }

      // ==================== SCRAPING ====================

      async function iniciarScraping() {
        const bairro = document.getElementById("input-bairro").value.trim();
        const nicho = document.getElementById("input-nicho").value.trim();

        if (!bairro || !nicho) {
          mostrarToast("Preencha bairro e nicho", "error");
          return;
        }

        const btn = document.getElementById("btn-scraping");
        btn.disabled = true;
        btn.innerHTML =
          '<i class="fas fa-spinner animate-spin"></i><span>Iniciando...</span>';

        document.getElementById("scraping-status").classList.remove("hidden");

        try {
          const response = await fetch("/api/scraping/iniciar", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ bairro, nicho }),
          });

          const data = await response.json();

          if (response.ok) {
            mostrarToast("Prospecção iniciada!", "success");
            monitorarScraping(data.job_id);
          } else {
            mostrarToast(data.error || "Erro ao iniciar", "error");
            btn.disabled = false;
            btn.innerHTML =
              '<i class="fas fa-play"></i><span>Iniciar Prospecção</span>';
          }
        } catch (error) {
          mostrarToast("Erro de conexão", "error");
          btn.disabled = false;
          btn.innerHTML =
            '<i class="fas fa-play"></i><span>Iniciar Prospecção</span>';
        }
      }

      async function monitorarScraping(jobId) {
        const logDiv = document.getElementById("scraping-log");
        logDiv.innerHTML = "";

        const interval = setInterval(async () => {
          try {
            // Busca progresso detalhado
            const progressResponse = await fetch(
              `/api/scraping/progresso/${jobId}`,
            );
            const progressData = await progressResponse.json();

            // Busca status do job
            const statusResponse = await fetch(`/api/scraping/status/${jobId}`);
            const statusData = await statusResponse.json();

            // Atualiza log com progresso real
            if (progressData.progresso && progressData.progresso.length > 0) {
              logDiv.innerHTML = progressData.progresso
                .map((p) => `<div class="text-xs py-1">${p.mensagem}</div>`)
                .join("");
              logDiv.scrollTop = logDiv.scrollHeight;
            }

            if (statusData.status === "concluido") {
              clearInterval(interval);
              mostrarToast(
                `✅ ${statusData.leads_novos} novos leads!`,
                "success",
              );
              document
                .getElementById("scraping-status")
                .classList.add("hidden");
              document.getElementById("btn-scraping").disabled = false;
              document.getElementById("btn-scraping").innerHTML =
                '<i class="fas fa-play"></i><span>Iniciar Prospecção</span>';
              carregarLeads();
              carregarEstatisticas();
            } else if (statusData.status === "erro") {
              clearInterval(interval);
              mostrarToast("❌ Erro na prospecção", "error");
              document
                .getElementById("scraping-status")
                .classList.add("hidden");
              document.getElementById("btn-scraping").disabled = false;
              document.getElementById("btn-scraping").innerHTML =
                '<i class="fas fa-play"></i><span>Iniciar Prospecção</span>';
            }
          } catch (error) {
            clearInterval(interval);
          }
        }, 1500);
      }

      // ==================== FILTROS ====================

      function filtrarLeads(chave, valor) {
        const filtros = {};
        filtros[chave] = valor;
        carregarLeads(1, filtros);
      }

      function buscarLeads() {
        const termo = document.getElementById("input-search").value.trim();
        if (termo) {
          // Busca simples (pode ser melhorada com endpoint específico)
          carregarLeads(1, { search: termo });
        } else {
          carregarLeads();
        }
      }

      function recarregarTabela() {
        carregarLeads(currentPage, currentFilter);
      }

      // ==================== AÇÕES EM LOTE ====================

      function toggleSelectAll() {
        const selectAll = document.getElementById("select-all");
        const checkboxes = document.querySelectorAll(".checkbox-lead");

        if (selectAll.checked) {
          checkboxes.forEach((cb) => {
            cb.checked = true;
            const leadId = parseInt(
              cb.getAttribute("onchange").match(/\d+/)[0],
            );
            leadsSelecionados.add(leadId);
          });
        } else {
          leadsSelecionados.clear();
          checkboxes.forEach((cb) => (cb.checked = false));
        }

        atualizarContadorSelecionados();
      }

      function toggleLead(id) {
        if (leadsSelecionados.has(id)) {
          leadsSelecionados.delete(id);
        } else {
          leadsSelecionados.add(id);
        }
        atualizarContadorSelecionados();
        document.getElementById("select-all").checked = false;
      }

      function atualizarContadorSelecionados() {
        document.getElementById("contador-selecionados").textContent =
          leadsSelecionados.size;
      }

      async function gerarPrintsLote() {
        if (leadsSelecionados.size === 0) {
          mostrarToast("Selecione pelo menos um lead", "warning");
          return;
        }

        mostrarToast("Gerando prints...", "info");

        try {
          const response = await fetch("/api/leads/gerar-prints-lote", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ lead_ids: Array.from(leadsSelecionados) }),
          });

          const data = await response.json();

          if (response.ok) {
            mostrarToast(data.message, "success");
            carregarLeads();
          } else {
            mostrarToast(data.error, "error");
          }
        } catch (error) {
          mostrarToast("Erro ao gerar prints", "error");
        }
      }

      async function gerarPrintLead(leadId) {
        mostrarToast("🖨️ Gerando print...", "info");

        try {
          const response = await fetch(`/api/leads/${leadId}/gerar-print`, {
            method: "POST",
          });

          const data = await response.json();

          if (response.ok) {
            mostrarToast("✅ Print gerado com sucesso!", "success");
            carregarLeads();

            // Abre o print em nova aba
            if (data.url_print) {
              setTimeout(() => {
                window.open(data.url_print, "_blank");
              }, 500);
            }
          } else {
            mostrarToast(
              "❌ " + (data.error || "Erro ao gerar print"),
              "error",
            );
          }
        } catch (error) {
          mostrarToast("❌ Erro de conexão", "error");
        }
      }

      async function mudarStatus(leadId, novoStatus) {
        try {
          const response = await fetch(`/api/leads/${leadId}/status`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ status: novoStatus }),
          });

          if (response.ok) {
            mostrarToast(`Status atualizado para "${novoStatus}"`, "success");
            carregarLeads();
            carregarEstatisticas();
          }
        } catch (error) {
          mostrarToast("Erro ao atualizar status", "error");
        }
      }

      function exportarCSV() {
        window.open("/api/leads?per_page=99999&format=csv", "_blank");
      }

      // ==================== UTILITÁRIOS ====================

      function formatarTelefone(telefone) {
        if (!telefone) return "";
        const num = telefone.replace(/\D/g, "");
        if (num.length === 11) {
          return `(${num.slice(0, 2)}) ${num.slice(2, 7)}-${num.slice(7)}`;
        } else if (num.length === 10) {
          return `(${num.slice(0, 2)}) ${num.slice(2, 6)}-${num.slice(6)}`;
        }
        return telefone;
      }

      function getStatusClass(status) {
        const classes = {
          Novo: "bg-blue-100 text-blue-700",
          Contatado: "bg-yellow-100 text-yellow-700",
          Interessado: "bg-green-100 text-green-700",
          Fechado: "bg-purple-100 text-purple-700",
          Descartado: "bg-gray-100 text-gray-500",
        };
        return classes[status] || "bg-gray-100 text-gray-700";
      }

      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      function copiarLink(link) {
        navigator.clipboard.writeText(link).then(() => {
          mostrarToast("Link copiado!", "success");
        });
      }

      function mostrarToast(mensagem, tipo = "info") {
        const toast = document.getElementById("toast");
        const cores = {
          success: "bg-green-500",
          error: "bg-red-500",
          warning: "bg-yellow-500",
          info: "bg-blue-500",
        };

        toast.className = `toast ${cores[tipo]} text-white px-6 py-4 rounded-xl shadow-2xl flex items-center gap-3`;
        toast.innerHTML = `
                <i class="fas fa-${tipo === "success" ? "check-circle" : tipo === "error" ? "times-circle" : "info-circle"}"></i>
                <span class="font-medium">${mensagem}</span>
            `;
        toast.classList.remove("hidden");

        setTimeout(() => {
          toast.classList.add("hidden");
        }, 3000);
      }

      function atualizarPaginacao(data) {
        const paginacao = document.getElementById("paginacao");
        if (data.total_pages <= 1) {
          paginacao.innerHTML = "";
          return;
        }

        let html = `
                <button onclick="carregarLeads(${currentPage - 1})" 
                        ${currentPage === 1 ? "disabled" : ""}
                        class="px-4 py-2 rounded-xl ${currentPage === 1 ? "bg-gray-100 text-gray-400" : "bg-white border border-gray-200 hover:bg-gray-50 text-gray-700"} font-medium transition-all">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <div class="flex items-center gap-2">
            `;

        for (let i = 1; i <= data.total_pages; i++) {
          html += `
                    <button onclick="carregarLeads(${i})" 
                            class="w-10 h-10 rounded-xl ${i === currentPage ? "bg-primary text-white" : "bg-white border border-gray-200 hover:bg-gray-50 text-gray-700"} font-bold transition-all">
                        ${i}
                    </button>
                `;
        }

        html += `
                </div>
                <button onclick="carregarLeads(${currentPage + 1})" 
                        ${currentPage === data.total_pages ? "disabled" : ""}
                        class="px-4 py-2 rounded-xl ${currentPage === data.total_pages ? "bg-gray-100 text-gray-400" : "bg-white border border-gray-200 hover:bg-gray-50 text-gray-700"} font-medium transition-all">
                    <i class="fas fa-chevron-right"></i>
                </button>
            `;

        paginacao.innerHTML = html;
      }
    </script>
  </body>
</html>
